version: 2

builds:
  - id: pigeon
    main: ./cmd/pigeon
    binary: pigeon
    env:
      - CGO_ENABLED=0 # modernc.org/sqlite is pure Go — safe to cross-compile
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/tomowang/pigeoncli/internal/buildinfo.Version={{.Version}}
      - -X github.com/tomowang/pigeoncli/internal/buildinfo.Commit={{.Commit}}
      - -X github.com/tomowang/pigeoncli/internal/buildinfo.Date={{.Date}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

brews:
  - name: pigeon
    repository:
      owner: tomowang
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/tomowang/pigeoncli
    description: Local email client for the terminal
    license: MIT
    test: |
      system "#{bin}/pigeon", "version"

changelog:
  sort: asc
  format: "{{ .Message }}"
  filters:
    exclude:
      - '^docs(\(.+\))?:'
      - '^test(\(.+\))?:'
      - '^ci(\(.+\))?:'
      - '^chore(\(.+\))?:'
      - '^build(\(.+\))?:'
  groups:
    - title: Features
      regexp: '^feat(\(.+\))?!?:'
      order: 0
    - title: Bug fixes
      regexp: '^fix(\(.+\))?!?:'
      order: 1
    - title: Performance improvements
      regexp: '^perf(\(.+\))?!?:'
      order: 2
    - title: Others
      order: 999
